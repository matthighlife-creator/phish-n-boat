<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- body silver elongated -->
  <path d="M 85,110 C 85,65 155,48 245,48 C 340,48 395,72 408,110 C 395,148 340,172 245,172 C 155,172 85,155 85,110 Z" fill="#c0c8c8" stroke="#606868" stroke-width="2"/>
  <!-- silver sheen -->
  <ellipse cx="255" cy="90" rx="135" ry="28" fill="white" opacity="0.18"/>
  <!-- 7 continuous horizontal stripes (KEY MARK) -->
  <path d="M 98,72 Q 255,69 398,75" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 95,84 Q 255,81 402,87" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 93,96 Q 255,93 405,99" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 93,108 Q 255,105 405,111" fill="none" stroke="#283838" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 93,120 Q 255,117 405,123" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 94,132 Q 255,130 402,135" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 96,144 Q 255,142 398,147" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <!-- tail fin (forked) -->
  <path d="M 393,80 Q 428,48 450,72 Q 435,110 450,148 Q 428,172 393,140 Z" fill="#a0a8a8" stroke="#606868" stroke-width="2"/>
  <!-- first dorsal (spiny) -->
  <path d="M 150,58 L 158,18 L 192,14 L 225,18 L 232,58 Z" fill="#a0a8a8" stroke="#606868" stroke-width="1.5"/>
  <!-- second dorsal (soft) -->
  <path d="M 258,58 Q 278,30 310,28 L 340,30 L 350,58 Z" fill="#a0a8a8" stroke="#606868" stroke-width="1.5"/>
  <!-- pectoral fin -->
  <ellipse cx="106" cy="122" rx="26" ry="11" fill="#a0a8a8" stroke="#606868" stroke-width="1.5" transform="rotate(-22 106 122)"/>
  <!-- anal fin -->
  <path d="M 268,166 L 258,195 L 325,192 L 332,166 Z" fill="#a0a8a8" stroke="#606868" stroke-width="1.5"/>
  <!-- mouth -->
  <path d="M 72,102 Q 60,110 72,118 Q 82,124 95,122 L 95,112 Q 84,111 76,110 Q 84,109 95,108 L 95,98 Q 82,96 72,102 Z" fill="#d0d8d8" stroke="#606868" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="85" cy="108" r="8" fill="white" stroke="#606868" stroke-width="1.5"/>
  <circle cx="85" cy="108" r="5" fill="#0a0a0a"/>
  <circle cx="83" cy="106" r="1.5" fill="white"/>
  <!-- gill plate -->
  <path d="M 96,80 Q 105,110 96,140" fill="none" stroke="#606868" stroke-width="2"/>

</svg>