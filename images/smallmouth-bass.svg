<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- body bronze-copper -->
  <path d="M 95,110 C 95,62 158,50 228,50 C 308,50 372,70 382,110 C 372,150 308,170 228,170 C 158,170 95,158 95,110 Z" fill="#8a6828" stroke="#4a3a14" stroke-width="2"/>
  <!-- bronze sheen highlight -->
  <ellipse cx="235" cy="92" rx="105" ry="30" fill="#c09038" opacity="0.25"/>
  <!-- vertical bars (KEY MARK - not horizontal) -->
  <path d="M 162,60 L 158,160" stroke="#3a2808" stroke-width="11" stroke-linecap="round" opacity="0.55"/>
  <path d="M 205,53 L 201,167" stroke="#3a2808" stroke-width="11" stroke-linecap="round" opacity="0.55"/>
  <path d="M 250,50 L 246,168" stroke="#3a2808" stroke-width="11" stroke-linecap="round" opacity="0.55"/>
  <path d="M 294,54 L 291,164" stroke="#3a2808" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
  <path d="M 334,66 L 331,154" stroke="#3a2808" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
  <!-- tail fin -->
  <path d="M 365,78 Q 408,42 432,64 Q 416,110 432,156 Q 408,176 365,142 Z" fill="#6a5018" stroke="#4a3a14" stroke-width="2"/>
  <!-- spiny dorsal -->
  <path d="M 138,58 L 152,18 L 180,14 L 208,18 L 218,58 Z" fill="#6a5018" stroke="#4a3a14" stroke-width="1.5"/>
  <!-- soft dorsal -->
  <path d="M 228,58 Q 252,28 282,26 L 312,28 L 322,58 Z" fill="#6a5018" stroke="#4a3a14" stroke-width="1.5"/>
  <!-- pectoral fin -->
  <ellipse cx="112" cy="124" rx="23" ry="10" fill="#6a5018" stroke="#4a3a14" stroke-width="1.5" transform="rotate(-22 112 124)"/>
  <!-- anal fin -->
  <path d="M 248,162 L 238,192 L 305,188 L 312,162 Z" fill="#6a5018" stroke="#4a3a14" stroke-width="1.5"/>
  <!-- SMALLER jaw ends AT eye (KEY MARK - does not extend past) -->
  <path d="M 76,100 Q 62,110 76,120 Q 88,128 102,126 L 102,114 Q 90,113 80,110 Q 90,107 102,106 L 102,94 Q 88,92 76,100 Z" fill="#9a7838" stroke="#4a3a14" stroke-width="1.5"/>
  <!-- RED eye (key smallmouth mark) -->
  <circle cx="88" cy="108" r="9" fill="white" stroke="#4a3a14" stroke-width="1.5"/>
  <circle cx="88" cy="108" r="6" fill="#cc2a10"/>
  <circle cx="86" cy="106" r="2" fill="white"/>
  <!-- gill plate -->
  <path d="M 103,80 Q 112,110 103,140" fill="none" stroke="#4a3a14" stroke-width="2"/>

</svg>