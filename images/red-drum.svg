<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- copper-bronze elongated body -->
  <path d="M 88,110 C 88,66 148,50 238,48 C 328,48 388,72 400,110 C 388,148 328,172 238,172 C 148,172 88,154 88,110 Z" fill="#b86028" stroke="#602808" stroke-width="2"/>
  <!-- copper sheen highlight -->
  <ellipse cx="245" cy="88" rx="130" ry="30" fill="#e08840" opacity="0.28"/>
  <!-- bronze reddish tint on sides -->
  <ellipse cx="238" cy="110" rx="148" ry="55" fill="#c87030" opacity="0.15"/>
  <!-- white belly -->
  <ellipse cx="248" cy="150" rx="125" ry="20" fill="#f0d8c0" opacity="0.35"/>
  <!-- slightly underslung mouth -->
  <path d="M 72,106 Q 58,114 72,120 Q 82,126 94,124 L 94,116 Q 82,115 74,112 Q 82,110 94,110 L 94,100 Q 82,98 72,106 Z" fill="#c87838" stroke="#602808" stroke-width="1.5"/>
  <!-- BLACK SPOT(S) near base of tail (KEY MARK) -->
  <circle cx="370" cy="112" r="16" fill="#0a0808" opacity="0.9"/>
  <circle cx="370" cy="112" r="12" fill="#080606"/>
  <!-- second spot (redfish often have 2+) -->
  <circle cx="350" cy="100" r="8" fill="#0a0808" opacity="0.7"/>
  <!-- tail fin (slightly forked) -->
  <path d="M 385,82 Q 422,52 445,72 Q 430,110 445,148 Q 422,168 385,138 Z" fill="#986020" stroke="#602808" stroke-width="2"/>
  <!-- dorsal fin spiny -->
  <path d="M 135,60 L 148,22 L 178,18 L 205,22 L 215,60 Z" fill="#986020" stroke="#602808" stroke-width="1.5"/>
  <!-- dorsal fin soft -->
  <path d="M 225,60 Q 248,30 278,28 L 308,30 L 318,60 Z" fill="#986020" stroke="#602808" stroke-width="1.5"/>
  <!-- pectoral fin -->
  <ellipse cx="106" cy="122" rx="24" ry="10" fill="#986020" stroke="#602808" stroke-width="1.5" transform="rotate(-20 106 122)"/>
  <!-- anal fin -->
  <path d="M 255,166 L 245,195 L 315,192 L 322,166 Z" fill="#986020" stroke="#602808" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="88" cy="106" r="9" fill="white" stroke="#602808" stroke-width="1.5"/>
  <circle cx="88" cy="106" r="6" fill="#0a0808"/>
  <circle cx="86" cy="104" r="2" fill="white"/>
  <!-- gill plate -->
  <path d="M 95,78 Q 104,110 95,142" fill="none" stroke="#602808" stroke-width="2"/>

</svg>