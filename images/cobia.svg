<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- dark brown elongated body -->
  <path d="M 72,110 C 72,78 118,58 228,55 C 342,55 408,78 418,110 C 408,142 342,165 228,165 C 118,165 72,142 72,110 Z" fill="#4a3218" stroke="#2a1808" stroke-width="2"/>
  <!-- FLATTENED shark-like head (KEY MARK) -->
  <path d="M 38,96 C 35,96 22,104 22,110 C 22,116 35,124 38,124 L 75,130 L 82,110 L 75,90 Z" fill="#3a2810" stroke="#2a1808" stroke-width="2"/>
  <!-- flat top of head -->
  <path d="M 38,96 Q 55,86 72,88" fill="none" stroke="#1a1008" stroke-width="3"/>
  <!-- WHITE/CREAM lateral stripe (present in younger, fading in adults) -->
  <path d="M 75,98 Q 240,94 415,104" fill="none" stroke="#c8b890" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <!-- dark stripe below -->
  <path d="M 75,108 Q 240,105 415,112" fill="none" stroke="#1a1008" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- FREE DORSAL SPINES ahead of main dorsal (KEY MARK) -->
  <line x1="130" y1="62" x2="130" y2="30" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="148" y1="60" x2="148" y2="25" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="58" x2="165" y2="22" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="182" y1="57" x2="182" y2="22" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="198" y1="57" x2="198" y2="22" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="213" y1="57" x2="213" y2="22" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="228" y1="57" x2="228" y2="22" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <line x1="242" y1="57" x2="242" y2="22" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
  <!-- main dorsal fin (long soft dorsal) -->
  <path d="M 255,57 Q 300,30 350,32 L 395,35 L 400,60" fill="#3a2010" stroke="#2a1808" stroke-width="1.5"/>
  <!-- anal fin (long) -->
  <path d="M 255,160 Q 310,185 370,182 L 395,175 L 398,162 Z" fill="#3a2010" stroke="#2a1808" stroke-width="1.5"/>
  <!-- slightly forked tail -->
  <path d="M 402,82 Q 435,55 455,75 Q 440,110 455,145 Q 435,165 402,138 Z" fill="#2a1808" stroke="#2a1808" stroke-width="2"/>
  <!-- pectoral fin -->
  <ellipse cx="88" cy="118" rx="26" ry="10" fill="#3a2010" stroke="#2a1808" stroke-width="1.5" transform="rotate(-20 88 118)"/>
  <!-- eye (on side of flattened head) -->
  <circle cx="52" cy="106" r="8" fill="white" stroke="#2a1808" stroke-width="1.5"/>
  <circle cx="52" cy="106" r="5" fill="#0a0808"/>
  <circle cx="50" cy="104" r="1.5" fill="white"/>

</svg>