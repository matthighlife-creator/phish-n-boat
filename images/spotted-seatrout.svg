<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- silver body with slightly upward mouth angle -->
  <path d="M 88,112 C 85,68 145,50 240,48 C 335,48 392,72 402,110 C 392,148 335,170 240,170 C 145,170 91,152 88,112 Z" fill="#b8c8c0" stroke="#586060" stroke-width="2"/>
  <!-- silver sheen -->
  <ellipse cx="248" cy="88" rx="135" ry="28" fill="white" opacity="0.18"/>
  <!-- white belly -->
  <ellipse cx="252" cy="152" rx="125" ry="18" fill="white" opacity="0.2"/>
  <!-- BLACK SPOTS on body, dorsal fin, and tail (KEY MARK) -->
  <!-- spots on upper body -->
  <circle cx="165" cy="76" r="6" fill="#181818" opacity="0.85"/>
  <circle cx="202" cy="68" r="7" fill="#181818" opacity="0.85"/>
  <circle cx="245" cy="64" r="6" fill="#181818" opacity="0.85"/>
  <circle cx="285" cy="68" r="8" fill="#181818" opacity="0.85"/>
  <circle cx="325" cy="74" r="6" fill="#181818" opacity="0.85"/>
  <circle cx="362" cy="82" r="7" fill="#181818" opacity="0.8"/>
  <circle cx="185" cy="90" r="5" fill="#181818" opacity="0.8"/>
  <circle cx="225" cy="86" r="6" fill="#181818" opacity="0.8"/>
  <circle cx="268" cy="84" r="5" fill="#181818" opacity="0.8"/>
  <circle cx="310" cy="88" r="6" fill="#181818" opacity="0.75"/>
  <circle cx="350" cy="95" r="5" fill="#181818" opacity="0.75"/>
  <!-- UPWARD-ANGLED mouth (KEY MARK) -->
  <path d="M 70,108 Q 55,116 70,124 Q 80,130 93,128 L 95,118 Q 82,116 72,113 Q 80,110 95,108 L 94,96 Q 78,94 70,108 Z" fill="#c8d8d0" stroke="#586060" stroke-width="1.5"/>
  <!-- tail fin with SPOTS (KEY MARK) -->
  <path d="M 386,82 Q 422,52 445,72 Q 430,110 445,148 Q 422,168 386,138 Z" fill="#98a8a0" stroke="#586060" stroke-width="2"/>
  <!-- spots ON the tail fin -->
  <circle cx="415" cy="72" r="5" fill="#181818" opacity="0.7"/>
  <circle cx="425" cy="88" r="4" fill="#181818" opacity="0.65"/>
  <circle cx="430" cy="128" r="4" fill="#181818" opacity="0.65"/>
  <circle cx="418" cy="148" r="5" fill="#181818" opacity="0.7"/>
  <!-- spots on dorsal fins too -->
  <!-- spiny dorsal with spots -->
  <path d="M 132,60 L 145,22 L 175,18 L 202,22 L 212,60 Z" fill="#98a8a0" stroke="#586060" stroke-width="1.5"/>
  <circle cx="160" cy="32" r="4" fill="#181818" opacity="0.7"/>
  <circle cx="188" cy="28" r="4" fill="#181818" opacity="0.65"/>
  <!-- soft dorsal with spots -->
  <path d="M 222,60 Q 245,30 275,28 L 305,30 L 315,60 Z" fill="#98a8a0" stroke="#586060" stroke-width="1.5"/>
  <circle cx="252" cy="38" r="4" fill="#181818" opacity="0.65"/>
  <circle cx="282" cy="35" r="4" fill="#181818" opacity="0.65"/>
  <!-- pectoral fin -->
  <ellipse cx="105" cy="122" rx="24" ry="10" fill="#98a8a0" stroke="#586060" stroke-width="1.5" transform="rotate(-22 105 122)"/>
  <!-- anal fin -->
  <path d="M 255,164 L 245,193 L 315,190 L 322,164 Z" fill="#98a8a0" stroke="#586060" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="85" cy="108" r="9" fill="white" stroke="#586060" stroke-width="1.5"/>
  <circle cx="85" cy="108" r="6" fill="#0a0a0a"/>
  <circle cx="83" cy="106" r="2" fill="white"/>
  <!-- gill plate -->
  <path d="M 96,78 Q 105,110 96,142" fill="none" stroke="#586060" stroke-width="2"/>

</svg>