<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- silver-gray deep body -->
  <ellipse cx="240" cy="110" rx="152" ry="82" fill="#a0a8a8" stroke="#484e4e" stroke-width="2.5"/>
  <!-- 5-7 BOLD BLACK VERTICAL BARS (KEY MARK) -->
  <rect x="114" y="42" width="18" height="136" rx="4" fill="#0a0a0a" opacity="0.85"/>
  <rect x="154" y="34" width="18" height="150" rx="4" fill="#0a0a0a" opacity="0.85"/>
  <rect x="198" y="30" width="18" height="158" rx="4" fill="#0a0a0a" opacity="0.85"/>
  <rect x="242" y="30" width="18" height="158" rx="4" fill="#0a0a0a" opacity="0.85"/>
  <rect x="286" y="32" width="18" height="154" rx="4" fill="#0a0a0a" opacity="0.85"/>
  <rect x="328" y="38" width="18" height="144" rx="4" fill="#0a0a0a" opacity="0.82"/>
  <rect x="364" y="48" width="16" height="124" rx="4" fill="#0a0a0a" opacity="0.75"/>
  <!-- Clip bars to body shape with overlay -->
  <ellipse cx="240" cy="110" rx="152" ry="82" fill="none" stroke="#0d1b2a" stroke-width="10"/>
  <!-- body outline restore -->
  <ellipse cx="240" cy="110" rx="152" ry="82" fill="none" stroke="#484e4e" stroke-width="2.5"/>
  <!-- gray background of body visible between bars -->
  <!-- silver sheen -->
  <ellipse cx="240" cy="90" rx="138" ry="35" fill="white" opacity="0.12"/>
  <!-- INCISOR TEETH visible (KEY MARK) - blunt snout, visible teeth at mouth -->
  <path d="M 78,104 Q 62,110 78,116 Q 86,120 96,118 L 96,112 Q 86,111 80,110 Q 86,109 96,108 L 96,102 Q 86,100 78,104 Z" fill="#b8c0c0" stroke="#484e4e" stroke-width="1.5"/>
  <!-- visible teeth (human-like incisors) -->
  <rect x="63" y="106" width="5" height="7" rx="1" fill="white" stroke="#606060" stroke-width="0.5"/>
  <rect x="70" y="105" width="5" height="8" rx="1" fill="white" stroke="#606060" stroke-width="0.5"/>
  <rect x="77" y="105" width="5" height="8" rx="1" fill="white" stroke="#606060" stroke-width="0.5"/>
  <!-- spiny dorsal (strong spines) -->
  <path d="M 110,38 L 120,4 L 145,2 L 168,5 L 185,8 L 198,14 L 206,26 L 210,38 Z" fill="#707878" stroke="#484e4e" stroke-width="1.5"/>
  <!-- soft dorsal -->
  <path d="M 220,38 Q 242,12 270,10 L 298,12 L 308,38 Z" fill="#707878" stroke="#484e4e" stroke-width="1.5"/>
  <!-- tail fin (slightly forked) -->
  <path d="M 385,72 Q 420,44 442,64 Q 428,110 442,156 Q 420,176 385,148 Z" fill="#707878" stroke="#484e4e" stroke-width="2"/>
  <!-- pectoral fin -->
  <ellipse cx="100" cy="120" rx="24" ry="10" fill="#707878" stroke="#484e4e" stroke-width="1.5" transform="rotate(-18 100 120)"/>
  <!-- anal fin (strong spines too) -->
  <path d="M 230,188 L 218,212 L 295,210 L 300,188 Z" fill="#707878" stroke="#484e4e" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="90" cy="106" r="9" fill="white" stroke="#484e4e" stroke-width="1.5"/>
  <circle cx="90" cy="106" r="6" fill="#0a0a0a"/>
  <circle cx="88" cy="104" r="2" fill="white"/>
  <!-- blunt snout shape -->
  <path d="M 78,96 Q 75,110 78,124" fill="none" stroke="#484e4e" stroke-width="1.5"/>

</svg>