<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- yellow-brown mottled elongated body -->
  <path d="M 80,112 C 80,82 128,62 225,58 C 320,56 388,78 398,112 C 388,146 320,168 225,162 C 128,158 80,142 80,112 Z" fill="#9a8040" stroke="#504010" stroke-width="2"/>
  <!-- mottled pattern -->
  <ellipse cx="180" cy="95" rx="30" ry="18" fill="#7a6028" opacity="0.4"/>
  <ellipse cx="250" cy="80" rx="28" ry="15" fill="#c0a058" opacity="0.3"/>
  <ellipse cx="310" cy="98" rx="22" ry="16" fill="#7a6028" opacity="0.4"/>
  <ellipse cx="200" cy="130" rx="25" ry="14" fill="#c0a058" opacity="0.3"/>
  <ellipse cx="270" cy="145" rx="28" ry="12" fill="#7a6028" opacity="0.35"/>
  <ellipse cx="340" cy="118" rx="20" ry="14" fill="#c0a058" opacity="0.3"/>
  <!-- WIDE FLAT HEAD (KEY MARK - looks like a shovel) -->
  <path d="M 50,88 C 48,88 36,98 36,112 C 36,126 48,132 50,132 L 82,138 L 90,112 L 82,86 Z" fill="#b09050" stroke="#504010" stroke-width="2"/>
  <!-- flat top of head emphasize -->
  <path d="M 50,88 Q 66,80 82,86" fill="none" stroke="#504010" stroke-width="3"/>
  <!-- LOWER JAW protrudes beyond upper (KEY MARK) -->
  <path d="M 36,112 Q 28,115 16,116 Q 28,119 36,120" fill="none" stroke="#504010" stroke-width="2"/>
  <path d="M 36,120 Q 24,128 12,130" fill="none" stroke="#706030" stroke-width="3" stroke-linecap="round"/>
  <!-- SQUARE tail (NOT deeply forked - KEY MARK) -->
  <path d="M 385,80 Q 420,70 445,75 L 445,148 Q 420,152 385,140 Z" fill="#806020" stroke="#504010" stroke-width="2"/>
  <!-- square tail top line -->
  <line x1="445" y1="75" x2="445" y2="148" stroke="#504010" stroke-width="2.5"/>
  <!-- dorsal fin -->
  <path d="M 148,66 L 158,28 L 192,24 L 212,32 L 212,66 Z" fill="#806020" stroke="#504010" stroke-width="1.5"/>
  <!-- adipose fin -->
  <path d="M 322,68 Q 345,60 360,68 L 356,80 Q 338,74 324,80 Z" fill="#806020" stroke="#504010" stroke-width="1.5"/>
  <!-- pectoral fin -->
  <ellipse cx="95" cy="128" rx="26" ry="10" fill="#806020" stroke="#504010" stroke-width="1.5" transform="rotate(-18 95 128)"/>
  <!-- anal fin (not deeply forked, squarish) -->
  <path d="M 265,160 L 262,188 L 355,186 L 355,160 Z" fill="#806020" stroke="#504010" stroke-width="1.5"/>
  <!-- barbels on wide head -->
  <path d="M 38,104 Q 16,96 4,88" fill="none" stroke="#504010" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36,112 Q 10,110 -2,110" fill="none" stroke="#504010" stroke-width="2" stroke-linecap="round"/>
  <path d="M 38,120 Q 16,126 4,135" fill="none" stroke="#504010" stroke-width="2" stroke-linecap="round"/>
  <path d="M 44,130 Q 32,144 25,158" fill="none" stroke="#504010" stroke-width="1.5" stroke-linecap="round"/>
  <!-- eye on top of flat head -->
  <circle cx="62" cy="98" r="7" fill="white" stroke="#504010" stroke-width="1.5"/>
  <circle cx="62" cy="98" r="5" fill="#0a0a0a"/>
  <circle cx="60" cy="96" r="1.5" fill="white"/>

</svg>