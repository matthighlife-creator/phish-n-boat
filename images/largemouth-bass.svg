<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- body olive-green -->
  <path d="M 95,110 C 95,60 160,48 230,48 C 310,48 375,68 385,110 C 375,152 310,172 230,172 C 160,172 95,160 95,110 Z" fill="#5a8a3a" stroke="#2a4a18" stroke-width="2"/>
  <!-- white belly -->
  <ellipse cx="245" cy="148" rx="120" ry="20" fill="#d8e8c0" opacity="0.45"/>
  <!-- lateral dark stripe (KEY MARK) -->
  <path d="M 105,108 Q 240,102 370,112" fill="none" stroke="#1a280a" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
  <!-- tail fin forked -->
  <path d="M 368,80 Q 410,45 435,68 Q 420,110 435,152 Q 410,175 368,140 Z" fill="#4a7828" stroke="#2a4a18" stroke-width="2"/>
  <!-- spiny dorsal -->
  <path d="M 138,56 L 155,16 L 185,12 L 210,16 L 218,56 Z" fill="#4a7828" stroke="#2a4a18" stroke-width="1.5"/>
  <!-- soft dorsal (deeply notched from spiny = two separate sections) -->
  <path d="M 226,56 Q 248,24 278,22 L 310,24 L 320,56 Z" fill="#4a7828" stroke="#2a4a18" stroke-width="1.5"/>
  <!-- pectoral fin -->
  <ellipse cx="112" cy="126" rx="25" ry="11" fill="#4a7828" stroke="#2a4a18" stroke-width="1.5" transform="rotate(-20 112 126)"/>
  <!-- anal fin -->
  <path d="M 248,168 L 238,196 L 308,193 L 315,168 Z" fill="#4a7828" stroke="#2a4a18" stroke-width="1.5"/>
  <!-- BIG jaw extends past eye (KEY MARK) -->
  <path d="M 62,98 Q 40,110 62,122 Q 78,134 100,132 L 102,116 Q 82,115 68,110 Q 82,105 102,104 L 100,88 Q 78,86 62,98 Z" fill="#6aaa48" stroke="#2a4a18" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="87" cy="107" r="9" fill="white" stroke="#2a4a18" stroke-width="1.5"/>
  <circle cx="87" cy="107" r="6" fill="#0a0a0a"/>
  <circle cx="85" cy="105" r="2" fill="white"/>
  <!-- gill plate line -->
  <path d="M 102,78 Q 112,110 102,142" fill="none" stroke="#2a4a18" stroke-width="2"/>

</svg>