<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">

  <rect width="480" height="220" fill="#0d1b2a" rx="6"/>
  <!-- body silver smaller/deeper than striper -->
  <path d="M 95,110 C 95,65 158,50 235,50 C 312,50 365,72 376,110 C 365,148 312,170 235,170 C 158,170 95,155 95,110 Z" fill="#b8c4c4" stroke="#585e5e" stroke-width="2"/>
  <!-- silver sheen -->
  <ellipse cx="240" cy="92" rx="110" ry="25" fill="white" opacity="0.16"/>
  <!-- BROKEN/INTERRUPTED stripes (KEY MARK - don't run full length cleanly) -->
  <path d="M 108,76 Q 175,73 218,75" fill="none" stroke="#283838" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 242,74 Q 295,73 355,77" fill="none" stroke="#283838" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 104,88 Q 180,85 225,87" fill="none" stroke="#283838" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 248,86 Q 300,85 360,89" fill="none" stroke="#283838" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 102,100 Q 180,97 370,103" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 102,112 Q 180,109 370,115" fill="none" stroke="#283838" stroke-width="5" stroke-linecap="round"/>
  <path d="M 103,124 Q 182,121 255,124" fill="none" stroke="#283838" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 276,122 Q 318,121 358,125" fill="none" stroke="#283838" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 106,136 Q 185,134 248,136" fill="none" stroke="#283838" stroke-width="4" stroke-linecap="round"/>
  <path d="M 270,135 Q 312,134 350,137" fill="none" stroke="#283838" stroke-width="4" stroke-linecap="round"/>
  <!-- tail fin -->
  <path d="M 360,80 Q 400,48 422,70 Q 408,110 422,150 Q 400,172 360,140 Z" fill="#98a4a4" stroke="#585e5e" stroke-width="2"/>
  <!-- spiny dorsal -->
  <path d="M 145,58 L 154,22 L 182,18 L 208,22 L 216,58 Z" fill="#98a4a4" stroke="#585e5e" stroke-width="1.5"/>
  <!-- soft dorsal -->
  <path d="M 228,58 Q 248,32 278,30 L 305,32 L 314,58 Z" fill="#98a4a4" stroke="#585e5e" stroke-width="1.5"/>
  <!-- pectoral fin -->
  <ellipse cx="110" cy="122" rx="22" ry="10" fill="#98a4a4" stroke="#585e5e" stroke-width="1.5" transform="rotate(-22 110 122)"/>
  <!-- anal fin -->
  <path d="M 248,162 L 240,190 L 302,187 L 308,162 Z" fill="#98a4a4" stroke="#585e5e" stroke-width="1.5"/>
  <!-- mouth -->
  <path d="M 78,102 Q 64,110 78,118 Q 88,125 100,123 L 100,112 Q 88,111 80,110 Q 88,109 100,108 L 100,97 Q 88,95 78,102 Z" fill="#c8d0d0" stroke="#585e5e" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="88" cy="108" r="8" fill="white" stroke="#585e5e" stroke-width="1.5"/>
  <circle cx="88" cy="108" r="5" fill="#0a0a0a"/>
  <circle cx="86" cy="106" r="1.5" fill="white"/>

</svg>